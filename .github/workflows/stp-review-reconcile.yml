name: STP settlement review

on:
  create:

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ github.event.ref_type == 'branch' && github.event.ref == 'stp-review-reconcile-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: sat20wallet
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          ref: main
          path: indexer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          ref: main
          path: satoshinet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          ref: main
          path: rgb11
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/badger
          ref: main
          path: badger
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Apply exact reviewed changes
        working-directory: sat20wallet
        run: |
          set -eu
          python3 .github/stp-review-reconcile.py
          gofmt -w sdk/wallet/native_contract_pending.go sdk/wallet/native_contract_settlement_state.go sdk/wallet/native_contract_reconcile_test.go
          git diff --check
      - name: Run settlement and network-lock regressions only
        working-directory: sat20wallet/sdk
        shell: bash
        run: |
          set -o pipefail
          go test ./wallet -run '^TestNativeContract(Settlement|Reconcile)' -count=1 -timeout=5m -v 2>&1 | tee /tmp/stp-reconcile.log
      - name: Publish validated source directly to main
        working-directory: sat20wallet
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/wallet/native_contract_pending.go sdk/wallet/native_contract_settlement_state.go sdk/wallet/native_contract_reconcile_test.go
          git rm .github/stp-review-reconcile.py .github/workflows/stp-review-reconcile.yml
          git diff --cached --check
          git commit -m 'fix(stp): reconcile native settlements without network locks [skip ci]'
          git push origin HEAD:main
          printf 'PUBLISHED_MAIN=%s\n' "$(git rev-parse HEAD)"
          git push origin --delete "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-reconcile-diagnostics
          path: /tmp/stp-reconcile.log
          retention-days: 1

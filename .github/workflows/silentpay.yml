name: Silent Payments SDK and PWA

on:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/wallet/silentpay*.go'
      - 'sdk/wallet/db.go'
      - 'sdk/wallet/wallet_catalog.go'
      - 'sdk/wallet/account_management_state.go'
      - 'sdk/wallet/interface.go'
      - 'sdk/wasm/silentpay.go'
      - 'sdk/wasm/main.go'
      - 'sdk/e2e/silentpay*_test.go'
      - 'pwa/**'
      - 'docs/bip352-silent-payments-v1.md'
      - 'docs/sp-real-l1-e2e.md'
      - '.github/workflows/silentpay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silentpay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: sat20wallet
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          path: rgb11
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          path: satoshinet
      - uses: actions/setup-go@v5
        with:
          go-version-file: sat20wallet/sdk/go.mod
          cache: false
      - name: Check SP Go formatting
        working-directory: sat20wallet
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'sdk/wallet/silentpay*.go' 'sdk/e2e/silentpay*.go' 'sdk/wasm/silentpay.go')
          if [[ -n "$files" ]]; then
            unformatted=$(gofmt -l $files)
            if [[ -n "$unformatted" ]]; then
              echo "Unformatted SP Go files:"
              echo "$unformatted"
              exit 1
            fi
          fi
      - name: Compile SDK wallet packages
        working-directory: sat20wallet/sdk
        run: go test ./wallet/... -run '^$' -count=1
      - name: Test SP SDK PWA acceptance scenarios
        working-directory: sat20wallet/sdk
        run: go test ./wallet -run '^TestSilentPay' -count=1 -v -timeout=12m
      - name: Test complete SDK wallet packages
        working-directory: sat20wallet/sdk
        run: go test ./wallet/... -count=1 -timeout=25m
      - name: Test account packages
        working-directory: sat20wallet/sdk
        run: go test ./account/... -count=1 -timeout=10m
      - name: Vet SDK wallet
        working-directory: sat20wallet/sdk
        run: go vet -copylocks=false ./wallet/...
      - name: Compile SDK virtual-node E2E
        working-directory: sat20wallet/sdk
        env:
          GOFLAGS: '-mod=mod'
        run: go test ./e2e -run '^$' -count=1 -timeout=10m
      - name: Install Bitcoin Core 31.0 for real regtest E2E
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 --silent --show-error https://bitcoincore.org/bin/bitcoin-core-31.0/SHA256SUMS --output SHA256SUMS
          curl --fail --location --retry 3 --silent --show-error https://bitcoincore.org/bin/bitcoin-core-31.0/bitcoin-31.0-x86_64-linux-gnu.tar.gz --output bitcoin-31.0-x86_64-linux-gnu.tar.gz
          grep ' bitcoin-31.0-x86_64-linux-gnu.tar.gz$' SHA256SUMS | sha256sum --check
          tar -xzf bitcoin-31.0-x86_64-linux-gnu.tar.gz
          echo "${RUNNER_TEMP}/bitcoin-31.0/bin" >> "${GITHUB_PATH}"
      - name: Check exact Bitcoin Core release
        shell: bash
        run: |
          set -euo pipefail
          bitcoind -version | head -n 1 | grep -F '31.0'
      - name: Real Bitcoin Core 31.0, BaseIndexer and SP SDK E2E
        working-directory: sat20wallet/sdk
        env:
          SAT20_E2E_REQUIRE_BITCOIND: '1'
          GOFLAGS: '-mod=mod'
        run: go test ./e2e -run '^TestSPBitcoinCoreRegtest' -v -count=1 -timeout=15m
      - name: Real Manager SP send and receive
        working-directory: sat20wallet/sdk
        env:
          SAT20_E2E_REQUIRE_BITCOIND: '1'
        run: go test ./e2e -run '^TestSPManagerBitcoinCoreSendReceiveE2E$' -count=1 -timeout=5m
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        working-directory: sat20wallet/pwa
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: SP PWA actual browser and WASM cases
        working-directory: sat20wallet/sdk
        env:
          SAT20_E2E_REQUIRE_BITCOIND: '1'
        run: go test ./e2e -run '^TestSPSilentPayBrowserE2E$' -count=1 -timeout=15m
      - name: Compile real WASM exports
        working-directory: sat20wallet/sdk
        run: GOOS=js GOARCH=wasm go build -buildvcs=false -o /tmp/sat20-silentpay.wasm ./wasm

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck PWA
        working-directory: pwa
        run: npm run compile

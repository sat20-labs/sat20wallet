name: Silent Payments SDK and PWA

on:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/wallet/silentpay*.go'
      - 'sdk/wallet/db.go'
      - 'sdk/wallet/wallet_catalog.go'
      - 'sdk/wallet/account_management_state.go'
      - 'sdk/wallet/interface.go'
      - 'sdk/wasm/silentpay.go'
      - 'sdk/wasm/main.go'
      - 'sdk/e2e/silentpay_bitcoind_e2e_test.go'
      - 'pwa/**'
      - 'docs/bip352-silent-payments-v1.md'
      - '.github/workflows/silentpay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silentpay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: sat20wallet
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          path: rgb11
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          path: satoshinet
      - uses: actions/setup-go@v5
        with:
          go-version-file: sat20wallet/sdk/go.mod
          cache: false
      - name: Normalize formatting in isolated CI checkout
        working-directory: sat20wallet
        run: |
          gofmt -w sdk/e2e/silentpay_bitcoind_e2e_test.go sdk/wallet/silentpay*.go sdk/wasm/silentpay.go sdk/wallet/db.go sdk/wallet/wallet_catalog.go sdk/wallet/account_management_state.go sdk/wallet/interface.go sdk/wasm/main.go
          git diff --stat
      - name: Compile wallet packages
        working-directory: sat20wallet/sdk
        run: go test ./wallet/... -run TestThisNameDoesNotExist -count=1
      - name: Test SP cryptography and HTTP E2E
        working-directory: sat20wallet/sdk
        run: go test ./wallet -run TestSilentPay -count=1 -v -timeout=10m
      - name: Test all account packages
        working-directory: sat20wallet/sdk
        run: go test ./account/... -count=1 -timeout=10m
      - name: Test all wallet packages
        working-directory: sat20wallet/sdk
        run: go test ./wallet/... -count=1 -timeout=20m
      - name: Vet wallet packages
        working-directory: sat20wallet/sdk
        run: go vet -copylocks=false ./wallet/...
      - name: Compile SDK virtual-node E2E
        working-directory: sat20wallet/sdk
        run: go test ./e2e -run TestThisNameDoesNotExist -count=1 -timeout=10m
      - name: Install Bitcoin Core 29.2 for real regtest E2E
        working-directory: sat20wallet
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 --silent --show-error https://bitcoincore.org/bin/bitcoin-core-29.2/SHA256SUMS --output SHA256SUMS
          curl --fail --location --retry 3 --silent --show-error https://bitcoincore.org/bin/bitcoin-core-29.2/bitcoin-29.2-x86_64-linux-gnu.tar.gz --output bitcoin-29.2-x86_64-linux-gnu.tar.gz
          grep ' bitcoin-29.2-x86_64-linux-gnu.tar.gz      - name: Compile real WASM exports
        working-directory: sat20wallet/sdk
        run: GOOS=js GOARCH=wasm go build -buildvcs=false -o /tmp/sat20-silentpay.wasm ./wasm

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck PWA
        working-directory: pwa
        run: npm run compile
 SHA256SUMS | sha256sum --check
          tar -xzf bitcoin-29.2-x86_64-linux-gnu.tar.gz
          echo "${RUNNER_TEMP}/bitcoin-29.2/bin" >> "${GITHUB_PATH}"
      - name: Real Bitcoin Core regtest and BaseIndexer SP E2E
        working-directory: sat20wallet/sdk
        env:
          SAT20_E2E_REQUIRE_BITCOIND: '1'
          GOFLAGS: '-mod=mod'
        run: go test ./e2e -run '^TestSPBitcoinCoreRegtestIndexerE2E      - name: Compile real WASM exports
        working-directory: sat20wallet/sdk
        run: GOOS=js GOARCH=wasm go build -buildvcs=false -o /tmp/sat20-silentpay.wasm ./wasm

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck PWA
        working-directory: pwa
        run: npm run compile
 -v -count=1 -timeout=15m
      - name: Compile real WASM exports
        working-directory: sat20wallet/sdk
        run: GOOS=js GOARCH=wasm go build -buildvcs=false -o /tmp/sat20-silentpay.wasm ./wasm

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck PWA
        working-directory: pwa
        run: npm run compile

name: BIP352 Silent Payments V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/wallet/silentpay*.go'
      - 'sdk/wallet/db.go'
      - 'sdk/wallet/interface.go'
      - 'sdk/wallet/wallet_catalog.go'
      - 'sdk/wallet/account_management_state.go'
      - 'sdk/wasm/silentpay.go'
      - 'sdk/wasm/main.go'
      - 'pwa/**'
      - '.github/workflows/silent-payments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-sp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: sat20wallet
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          path: rgb11
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          path: satoshinet
      - uses: actions/setup-go@v5
        with:
          go-version-file: sat20wallet/sdk/go.mod
          cache: false
      - name: Test BIP352 SDK E2E
        working-directory: sat20wallet/sdk
        run: go test ./wallet -run 'TestSilentPay' -count=1 -v
      - name: Compile SDK and WASM
        working-directory: sat20wallet/sdk
        run: |
          go test ./wallet/... -run '^$'
          GOOS=js GOARCH=wasm go build -o /tmp/silentpay.wasm ./wasm

  pwa-sp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: pwa
      - run: npm run compile
        working-directory: pwa

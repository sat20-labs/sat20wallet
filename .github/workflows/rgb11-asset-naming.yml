name: RGB11 PWA asset naming

on:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'pwa/**'
      - '.github/workflows/rgb11-asset-naming.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rgb11-asset-naming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pwa-naming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout wallet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install PWA dependencies
        working-directory: pwa
        run: |
          if test -f package-lock.json; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Test actual PWA naming decorator
        working-directory: pwa
        run: node --test scripts/verify/rgb11-asset-naming.test.mjs

      - name: Type-check PWA
        working-directory: pwa
        run: npm run compile

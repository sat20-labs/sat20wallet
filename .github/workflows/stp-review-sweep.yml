name: STP sweep review
on:
  create:
permissions:
  contents: read
jobs:
  sweep:
    if: ${{ github.event.ref_type == 'branch' && startsWith(github.event.ref, 'stp-review-sweep-20261023') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: sat20wallet
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          ref: main
          path: indexer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          ref: main
          path: satoshinet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          ref: main
          path: rgb11
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sat20-labs/badger
          ref: main
          path: badger
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Apply reviewed changes
        working-directory: sat20wallet
        run: |
          set -eu
          python3 .github/stp-review-sweep.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sdk/wallet/stp_sweep_verify_test.go')
          text = p.read_text()
          old = 'Funding: []rgb11wallet.ChannelFunding{{}},'
          assert text.count(old) == 1
          text = text.replace(old, 'Funding: []rgb11wallet.ChannelFunding{{Amount: *indexer.NewDefaultDecimal(1)}},')
          text = text.replace('\t_ = indexer.ASSET_PLAIN_SAT\n', '')
          p.write_text(text)
          PY
          gofmt -w sdk/wire/types_contract.go sdk/wallet/rgb11_channel_proof.go sdk/wallet/stp_sweep_verify.go sdk/wallet/stp_sweep_verify_test.go
          git diff --check
      - name: Test sweep protection and asset reconstruction only
        working-directory: sat20wallet/sdk
        shell: bash
        run: |
          set +e
          go test ./wallet -run '^Test(STPServerSweep|STPSweep|AtomicalsRebuild|RGB11ChannelProof)' -count=1 -timeout=5m -v > /tmp/stp-sweep.log 2>&1
          code=$?
          grep -E '^=== RUN|^--- (PASS|FAIL)|^ok |^FAIL|^#|^wallet/|panic:|fatal error:' /tmp/stp-sweep.log || true
          if [ "$code" -ne 0 ]; then tail -100 /tmp/stp-sweep.log; fi
          exit "$code"
      - name: Publish validated source directly to main
        working-directory: sat20wallet
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/wire/types_contract.go sdk/wallet/rgb11_channel_proof.go sdk/wallet/stp_sweep_verify.go sdk/wallet/stp_sweep_verify_test.go
          git rm .github/stp-review-sweep.py .github/workflows/stp-review-sweep.yml
          git diff --cached --check
          git commit -m 'fix(stp): verify public native proofs and asset conservation before sweep signatures [skip ci]'
          git push origin HEAD:main
          printf 'PUBLISHED_MAIN=%s\n' "$(git rev-parse HEAD)"
          git push origin --delete "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-sweep-diagnostics
          path: /tmp/stp-sweep.log
          retention-days: 1

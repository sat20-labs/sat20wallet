name: RGB11 naming branch verification

on:
  push:
    branches:
      - feat/rgb11-provider-asset-names

permissions:
  contents: read

concurrency:
  group: rgb11-naming-branch-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4
        with:
          path: sat20wallet
          fetch-depth: 0
      - name: Checkout indexer
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
      - name: Checkout RGB11
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/rgb11
          path: rgb11
      - name: Checkout SatoshiNet
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/satoshinet
          path: satoshinet
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sat20wallet/sdk/go.mod
          cache: false
      - name: Check formatting
        working-directory: sat20wallet
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'sdk/**/*.go')
          if (( ${#files[@]} )); then
            unformatted=$(gofmt -l "${files[@]}")
            test -z "$unformatted" || { printf 'Unformatted files:\n%s\n' "$unformatted"; exit 1; }
          fi
          git diff --check origin/main...HEAD
      - name: RGB11 package tests
        working-directory: sat20wallet/sdk
        run: go test ./wallet/rgb11/... -count=1 -timeout=10m
      - name: Naming integration tests
        working-directory: sat20wallet/sdk
        run: go test ./wallet -run '^(TestRGB11NamingIssueRenameAndReceiverOrigin|TestRGB11TranscendRegistrationDescriptorRoundTrip|TestRGB11TranscendDeployPayloadFitsSatoshiNetLimit)$' -count=1 -timeout=10m -v
      - name: Connected SDK naming E2E
        working-directory: sat20wallet/sdk
        run: go test ./wallet -run '^TestSDKCoreModulesValidation$' -count=1 -timeout=10m -v
      - name: Wallet regression
        working-directory: sat20wallet/sdk
        run: go test ./wallet/... -count=1 -timeout=12m
      - name: Vet wallet
        working-directory: sat20wallet/sdk
        run: go vet -copylocks=false ./wallet/...
      - name: Compile WASM
        working-directory: sat20wallet/sdk
        run: GOOS=js GOARCH=wasm go build -buildvcs=false -o /tmp/rgb11-naming.wasm ./wasm
